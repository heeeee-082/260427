<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 감정 우체통</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquareRound@master/nanumsquareround.css">
  <style>
    body {
      font-family: 'NanumSquareRound', sans-serif;
      background-color: #f5f3ff;
      color: #4c1d95;
      letter-spacing: -0.02em;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15);
    }

    .btn-gradient {
      background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-gradient:hover {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .input-style {
      width: 100%;
      padding: 1rem;
      border-radius: 1.25rem;
      border: 2px solid #ddd6fe;
      background-color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }

    .input-style:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    #reasonModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(46, 16, 101, 0.3);
      backdrop-filter: blur(6px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-anim {
      animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full glass-card rounded-[2.5rem] p-8 md:p-10 space-y-8 border-2 border-purple-100">
    <div class="text-center space-y-4">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-purple-100 rounded-3xl text-3xl">
        💜
      </div>
      <div>
        <h1 class="text-3xl font-extrabold text-purple-900 mb-1">감정 우체통</h1>
        <p class="text-purple-400 font-medium">오늘 너의 기분을 선생님께 들려줘</p>
      </div>
    </div>

    <div class="space-y-6">
      <div class="space-y-2">
        <label class="block text-sm font-bold text-purple-700 ml-1">나의 이름</label>
        <input type="text" id="studentName" placeholder="이름을 알려줘" class="input-style">
      </div>

      <div class="space-y-2">
        <label class="block text-sm font-bold text-purple-700 ml-1">지금 내 기분 (키워드)</label>
        <input type="text" id="emotionKeyword" placeholder="예: 행복함, 긴장됨, 속상함" class="input-style">
      </div>

      <button onclick="openReasonModal()" id="mainSubmitBtn"
        class="w-full btn-gradient text-white py-4 rounded-[1.25rem] font-bold text-lg shadow-md mt-2">
        마음 전달하기
      </button>
    </div>

    <div id="loadingStatus" class="hidden text-center py-6">
      <div class="flex justify-center mb-4">
        <div class="w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
      </div>
      <p class="text-purple-600 font-bold animate-pulse">선생님이 답변을 적고 계셔...</p>
    </div>
    
    <div id="resultArea" class="hidden space-y-4 p-6 rounded-3xl bg-white border border-purple-100 shadow-sm">
      <div class="flex items-center gap-2 text-purple-800">
        <span class="text-xl">💌</span>
        <h3 class="font-bold">선생님의 메시지가 도착했어</h3>
      </div>
      <p id="feedbackText" class="text-purple-700 leading-relaxed font-medium"></p>
      <button onclick="location.reload()" class="w-full text-sm text-purple-300 font-bold hover:text-purple-500 transition-colors pt-2">
        한 번 더 기록하기
      </button>
    </div>
  </div>

  <div id="reasonModal">
    <div class="modal-anim bg-white p-8 rounded-[2rem] max-w-sm w-full shadow-2xl space-y-6">
      <div class="text-center">
        <h2 class="text-2xl font-extrabold text-purple-800 mb-2">무슨 일이 있었니?</h2>
        <p id="modalQuestion" class="text-purple-500 font-medium"></p>
      </div>
      
      <textarea id="reasonContent" placeholder="그 기분을 느낀 이유를 자유롭게 적어줘." rows="4"
        class="input-style h-32 resize-none focus:bg-purple-50/30"></textarea>
      
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-4 rounded-2xl bg-gray-50 text-gray-400 font-bold hover:bg-gray-100 transition-colors">취소</button>
        <button onclick="sendToTeacher()" class="flex-[2] py-4 rounded-2xl btn-gradient text-white font-bold">선생님께 보내기</button>
      </div>
    </div>
  </div>

  <script>
    function openReasonModal() {
      const name = document.getElementById('studentName').value.trim();
      const emotion = document.getElementById('emotionKeyword').value.trim();

      if (!name || !emotion) {
        alert("이름과 기분을 먼저 적어줄래? 😊");
        return;
      }

      document.getElementById('modalQuestion').innerText = `${name}야, ${emotion} 기분이 든 이유가 궁금해!`;
      document.getElementById('reasonModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('reasonModal').style.display = 'none';
    }

    function sendToTeacher() {
      const name = document.getElementById('studentName').value.trim();
      const emotion = document.getElementById('emotionKeyword').value.trim();
      const reason = document.getElementById('reasonContent').value.trim();

      if (!reason) {
        alert("이유를 조금만 더 적어주면 선생님이 더 잘 이해할 수 있어!");
        return;
      }

      closeModal();
      
      const submitBtn = document.getElementById('mainSubmitBtn');
      const loading = document.getElementById('loadingStatus');
      const result = document.getElementById('resultArea');

      submitBtn.style.display = 'none';
      loading.classList.remove('hidden');

      // Google Apps Script 연동
      google.script.run
        .withSuccessHandler(function(res) {
          loading.classList.add('hidden');
          result.classList.remove('hidden');
          document.getElementById('feedbackText').innerText = res.feedback;
        })
        .withFailureHandler(function(err) {
          alert("앗, 전달하는 중에 문제가 생겼어. 다시 시도해 볼까?");
          loading.classList.add('hidden');
          submitBtn.style.display = 'block';
        })
        .processStudentData({
          name: name,
          emotion: emotion,
          reason: reason
        });
    }
  </script>
</body>
</html>
